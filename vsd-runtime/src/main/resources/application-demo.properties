# Demo profile: serves vsd-runtime/demo-site with plugins loaded from the repository's plugin
# modules. Run from the vsd-runtime directory with --spring.profiles.active=demo.
vsd.runtime.snapshot-dir=demo-site
vsd.runtime.plugins-dir=does-not-exist
vsd.runtime.dev-plugin-dirs=../plugins/container-layout-plugin,../plugins/label-component-plugin,\
  ../plugins/button-component-plugin,../plugins/textbox-component-plugin,../plugins/navbar-component-plugin,\
  ../plugins/auth-component-plugin,../plugins/newsletter-form-plugin

# Development identity (plain text, never use outside a demo).
vsd.runtime.users[0].id=u1
vsd.runtime.users[0].username=demo
vsd.runtime.users[0].email=demo@example.com
vsd.runtime.users[0].password=demo-pass
vsd.runtime.users[0].display-name=Demo User
vsd.runtime.users[0].roles=USER

# Data sources: the demo's API source calls this server's own /assets/releases.json.
vsd.runtime.data.allowed-hosts=127.0.0.1
vsd.runtime.data.allow-private-addresses=true

# Shared state declared for the demo (the newsletter subscription), and the console admin token.
vsd.runtime.data-dir=demo-data
vsd.runtime.console.admin-token=demo-admin
