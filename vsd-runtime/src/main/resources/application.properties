spring.application.name=vsd-runtime
server.port=8090

# Published snapshot to serve (site.json + pages/*.json) and where plugins come from.
vsd.runtime.snapshot-dir=site-snapshot
vsd.runtime.plugins-dir=plugins

# Behind a reverse proxy, let Spring trust X-Forwarded-* so request.isSecure() and client IPs are right:
# server.forward-headers-strategy=framework
# vsd.runtime.cookie-secure=true

vsd.runtime.session-idle-timeout=30m
