# Preview Server defaults
server.port=3001
spring.application.name=vsd-preview-server

# Data directory for deployed snapshots
preview.data-dir=${user.home}/.vsd/preview-data

# Actuator health endpoint for startup detection
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Multipart upload (snapshot zip)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Site Runtime defaults
site.runtime.auth.type=none
site.runtime.cache.type=memory
site.runtime.cache.default-ttl-ms=5000
